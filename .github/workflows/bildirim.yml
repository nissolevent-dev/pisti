name: Bildirim gönder

# Bildirimi gönderen kod (gonder.js) bu dosyanın içinde, ayrıca dosya gerekmez.
# Saatler UTC'dir (İstanbul = UTC+3).
on:
  schedule:
    - cron: '0 17 * * 2'      # Salı 20:00       — Yarın kim var?
    - cron: '0 19 * * 2'      # Salı 22:00       — hatırlatma
    - cron: '0 13 * * 3'      # Çarşamba 16:00   — hatırlatma
    - cron: '0 17 * * 5'      # Cuma 20:00       — Yarın kim var?
    - cron: '0 19 * * 5'      # Cuma 22:00       — hatırlatma
    - cron: '0 8 * * 6'       # Cumartesi 11:00  — hatırlatma
    - cron: '30 15 * * 3'     # Çarşamba 18:30   — bugünün durumu (herkese)
    - cron: '0 9 * * 6'       # Cumartesi 12:00  — bugünün durumu (herkese)
    - cron: '*/5 6-21 * * *'  # 09:00–00:55 arası 5 dakikada bir: uygulamadan gelen gönderme isteği var mı?
  workflow_dispatch:
    inputs:
      mesaj:
        description: 'Mesaj (boş bırakırsan "Kim var?" gider)'
        required: false
        default: ''
      gun:
        description: 'Anket hangi gün için?'
        type: choice
        options: [otomatik, bugun, yarin]
        default: otomatik
      herkese:
        description: 'Cevap vermiş olanlara da gönder'
        type: boolean
        default: false
      slot:
        description: 'Boş bırak (cron-job.org otomatik çağrısı "kontrol" gönderir)'
        required: false
        default: ''

concurrency:
  group: bildirim
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yapılacak iş var mı?
        id: kontrol
        run: |
          DB="https://pisti-2f056-default-rtdb.europe-west1.firebasedatabase.app"
          # 5 dakikalık kontrol: GitHub'ın kendi zamanlaması ya da cron-job.org'dan gelen "kontrol" çağrısı
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/5 6-21 * * *" ]; } || [ "${{ inputs.slot }}" = "kontrol" ]; then
            # GitHub saat başı görevlerini bazen geciktiriyor ya da hiç çalıştırmıyor.
            # Bu yüzden 5 dakikalık kontrol, saati geçmiş ama gönderilmemiş bildirimi de yakalar (2 saat içinde).
            GUN=$(TZ=Europe/Istanbul date +%u); SA=$(TZ=Europe/Istanbul date +%H%M | sed 's/^0*//'); SA=${SA:-0}
            BUGUN=$(TZ=Europe/Istanbul date +%F); YARIN=$(TZ=Europe/Istanbul date -d tomorrow +%F)
            for S in "2 2000 sali20 $YARIN" "2 2200 sali22 $YARIN" "3 1600 carsamba16 $BUGUN" "5 2000 cuma20 $YARIN" "5 2200 cuma22 $YARIN" "6 1100 cumartesi11 $BUGUN" "3 1830 carsamba1830 $BUGUN" "6 1200 cumartesi12 $BUGUN"; do
              set -- $S
              if [ "$GUN" = "$1" ] && [ "$SA" -ge "$2" ] && [ "$SA" -lt $(( $2 + 200 )) ]; then
                F=$(curl -s --max-time 20 "$DB/pisti_bildirim/gonderilen/${4}_${3}.json")
                if [ "$F" = "null" ]; then
                  echo "Zamanı gelmiş bildirim: $3"
                  echo "slot=$3" >> "$GITHUB_OUTPUT"
                  echo "is=var" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            done
            V=$(curl -s --max-time 20 "$DB/pisti_bildirim/istek.json")
            # Anket cevabı bildirimleri gece (00:00–09:00) bekletilir, sabah toplu gider
            C=null
            if [ "$SA" -ge 900 ]; then C=$(curl -s --max-time 20 "$DB/pisti_bildirim/cevapOlay.json?shallow=true"); fi
            if { [ -z "$V" ] || [ "$V" = "null" ]; } && { [ -z "$C" ] || [ "$C" = "null" ]; }; then
              echo "Bekleyen iş yok."
              echo "is=yok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "is=var" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.kontrol.outputs.is == 'var'
        with:
          node-version: 20

      - name: Kurulum
        if: steps.kontrol.outputs.is == 'var'
        run: |
          mkdir -p bildirim && cd bildirim
          npm init -y > /dev/null
          npm install --no-audit --no-fund --loglevel=error web-push@3
          cat > gonder.js <<'JS_SONU'
          // Pişti — "Kim var?" bildirimlerini gönderir (standart Web Push, Firebase Messaging kullanılmaz).
          // GitHub Actions'taki "Bildirim gönder" görevi çalıştırır.
          //
          // Üç şekilde çalışır:
          //   1) Zamanlanmış: salı/cuma 20:00, hatırlatmalar 22:00 ve ertesi gün (çarşamba 16:00, cumartesi 11:00)
          //   2) Elle: GitHub → Actions → "Bildirim gönder" → Run workflow
          //   3) Uygulamadan: uygulamadaki "📣 Bildirim gönder" isteği pisti_bildirim/istek'e yazılır,
          //      görev 5 dakikada bir bakar ve gönderir.
          //
          // Bildirim yalnızca o günün anketine henüz cevap vermemiş kişilere gider
          // ("Cevap vermiş olanlara da gönder" seçilmedikçe).

          const webpush = require('web-push');

          const DB_URL = 'https://pisti-2f056-default-rtdb.europe-west1.firebasedatabase.app';
          const VAPID_ACIK = 'BNIJ6_b47nZk0g2nboe8QYKGQq6s3r-yKZL3JcqBvxSg0kjN4_nsEN8pUgTsyDhVc3cbdieLFmE1uI_VXwO_BcY';
          const VAPID_KONU = 'https://nissolevent-dev.github.io/pisti/';

          // Cron ifadesi → bildirim türü. gunFark: anketin günü (0 = bugün, 1 = yarın)
          const SLOTLAR = {
            // hg: haftanın günü (0 = pazar … 6 = cumartesi), sa: İstanbul saati (SSDD)
            '0 17 * * 2': { ad: 'sali20', gunFark: 1, tur: 'ilk', hg: 2, sa: 2000 },
            '0 19 * * 2': { ad: 'sali22', gunFark: 1, tur: 'hatirlatma', hg: 2, sa: 2200 },
            '0 13 * * 3': { ad: 'carsamba16', gunFark: 0, tur: 'hatirlatma', hg: 3, sa: 1600 },
            '0 17 * * 5': { ad: 'cuma20', gunFark: 1, tur: 'ilk', hg: 5, sa: 2000 },
            '0 19 * * 5': { ad: 'cuma22', gunFark: 1, tur: 'hatirlatma', hg: 5, sa: 2200 },
            '0 8 * * 6': { ad: 'cumartesi11', gunFark: 0, tur: 'hatirlatma', hg: 6, sa: 1100 },
            '30 15 * * 3': { ad: 'carsamba1830', gunFark: 0, tur: 'durum', hg: 3, sa: 1830 },
            '0 9 * * 6': { ad: 'cumartesi12', gunFark: 0, tur: 'durum', hg: 6, sa: 1200 }
          };

          const GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

          // Firebase Realtime Database (REST)
          async function dbAl(yol) {
            const r = await fetch(`${DB_URL}/${yol}.json`);
            if (!r.ok) throw new Error(`Okunamadı: ${yol} (${r.status})`);
            return r.json();
          }
          async function dbYaz(yol, deger) {
            const r = await fetch(`${DB_URL}/${yol}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(deger) });
            if (!r.ok) throw new Error(`Yazılamadı: ${yol} (${r.status})`);
          }
          async function dbSil(yol) {
            const r = await fetch(`${DB_URL}/${yol}.json`, { method: 'DELETE' });
            if (!r.ok) throw new Error(`Silinemedi: ${yol} (${r.status})`);
          }

          // İstanbul saatine göre YYYY-MM-DD
          function istanbulTarih(fark) {
            const an = new Date(Date.now() + (fark || 0) * 864e5);
            return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(an);
          }
          function haftaGunu(tarih) { return new Date(tarih + 'T12:00:00Z').getUTCDay(); }
          // Salı ve cuma "yarın", diğer günler "bugün"
          function otomatikFark() { const g = haftaGunu(istanbulTarih(0)); return (g === 2 || g === 5) ? 1 : 0; }

          async function anaIs() {
            const gizli = (process.env.VAPID_GIZLI || '').trim();
            if (!gizli) throw new Error('VAPID_GIZLI gizli bilgisi eksik.');
            webpush.setVapidDetails(VAPID_KONU, VAPID_ACIK, gizli);

            const olay = process.env.OLAY || '';
            const zaman = process.env.ZAMAN || '';
            let is;

            const slotAd = Object.values(SLOTLAR).find(x => x.ad === process.env.SLOT);
            if (olay === 'workflow_dispatch' && !slotAd && process.env.KONTROL !== 'kontrol') {
              is = { kaynak: 'github', mesaj: (process.env.MESAJ || '').trim(), gun: process.env.GUN || 'otomatik', herkese: process.env.HERKESE === 'true' };
            } else if (slotAd || SLOTLAR[zaman]) {
              const s = slotAd || SLOTLAR[zaman];
              // GitHub zamanlanmış görevi saatlerce geciktirebiliyor (ör. salı 22:00 görevi gece 01:10'da
              // çalıştı ve "yarın"ı perşembe sandı). Bildirim yalnızca kendi gününde ve saatinden
              // sonraki 2 saat içinde gönderilir; daha geç çalışırsa atlanır.
              const anSaat = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()).replace(':', ''));
              const anGun = haftaGunu(istanbulTarih(0));
              if (anGun !== s.hg || anSaat < s.sa || anSaat >= s.sa + 200) {
                console.log(`Zamanı geçmiş bildirim atlandı: ${s.ad} (şu an gün ${anGun}, saat ${anSaat})`);
                return;
              }
              // "durum" bildirimi cevap vermiş olanlar dahil herkese gider
              is = { kaynak: 'zaman', slot: s.ad, fark: s.gunFark, tur: s.tur, herkese: s.tur === 'durum' };
            } else {
              // Uygulamadan gelen istek
              const v = await dbAl('pisti_bildirim/istek');
              if (!v) { console.log('Bekleyen gönderme isteği yok.'); return; }
              await dbSil('pisti_bildirim/istek');
              if (Date.now() - (v.t || 0) > 3 * 3600e3) { console.log('3 saatten eski istek atlandı.'); return; }
              is = { kaynak: 'uygulama', mesaj: String(v.mesaj || '').trim(), gun: v.gun || 'otomatik', herkese: !!v.herkese, kim: v.kim || '' };
              // Uygulama anketin kesin tarihini gönderir; gece yarısını geçse bile gün kaymaz
              if (/^\d{4}-\d\d-\d\d$/.test(v.tarih || '')) {
                if (v.tarih < istanbulTarih(0)) { console.log('Geçmiş güne ait istek atlandı: ' + v.tarih); return; }
                is.tarih = v.tarih;
              }
            }

            const fark = is.fark != null ? is.fark : (is.gun === 'bugun' ? 0 : is.gun === 'yarin' ? 1 : otomatikFark());
            const tarih = is.tarih || istanbulTarih(fark);
            const gunAdi = GUNLER[haftaGunu(tarih)];
            const ne = tarih === istanbulTarih(0) ? 'Bugün' : tarih === istanbulTarih(1) ? 'Yarın' : gunAdi;

            // Zamanlanmış bildirim aynı gün iki kez gitmesin (görevler sırayla çalışır)
            if (is.kaynak === 'zaman') {
              const k = 'pisti_bildirim/gonderilen/' + tarih + '_' + is.slot;
              if (await dbAl(k)) { console.log('Bu bildirim zaten gönderilmiş.'); return; }
              await dbYaz(k, Date.now());
            }

            let baslik, govde;
            if (is.mesaj) {
              baslik = 'Pişti 🃏';
              govde = is.mesaj;
            } else if (is.tur === 'hatirlatma') {
              baslik = 'Hatırlatma: ' + ne + ' kim var? 🃏';
              govde = gunAdi + ' için henüz cevap vermedin. Dokun, Varım / Yokum de.';
            } else {
              baslik = ne + ' kim var? 🃏';
              govde = gunAdi + ' için cevabını ver: Varım / Belli değil / Yokum';
            }

            const [kayitlar, cevaplar] = await Promise.all([
              dbAl('pisti_bildirim/tokens'),
              dbAl('pisti_anket/' + tarih + '/cevaplar')
            ]);
            const cevaplayan = new Set(Object.values(cevaplar || {}).map(c => c && c.ad).filter(Boolean));

            // Günün durumu: gelenler saat gruplarıyla ("21:00 Dani, Nisso · 21:30 Kori"), sonra diğerleri
            if (is.tur === 'durum' && !is.mesaj) {
              const ad = x => String(x).split(' ')[0];
              const liste = Object.values(cevaplar || {}).filter(c => c && c.ad && c.cevap).sort((a, b) => (a.t || 0) - (b.t || 0));
              const gelen = liste.filter(c => c.cevap === 'var');
              const saatSirasi = ['21:00', '21:30', '13:00', '13:30', 'Daha geç'];
              const gruplar = {};
              gelen.forEach(c => { const k = c.saat || ''; (gruplar[k] = gruplar[k] || []).push(ad(c.ad)); });
              const anahtarlar = Object.keys(gruplar).sort((a, b) => {
                const ia = a ? (saatSirasi.indexOf(a) < 0 ? 50 : saatSirasi.indexOf(a)) : 99;
                const ib = b ? (saatSirasi.indexOf(b) < 0 ? 50 : saatSirasi.indexOf(b)) : 99;
                return ia - ib || a.localeCompare(b);
              });
              const satirlar = [];
              if (gelen.length) satirlar.push(`✅ Var (${gelen.length}): ` + anahtarlar.map(k => (k ? k + ' ' : '') + gruplar[k].join(', ')).join(' · '));
              const belki = liste.filter(c => c.cevap === 'belki').map(c => ad(c.ad));
              const yok = liste.filter(c => c.cevap === 'yok').map(c => ad(c.ad));
              if (belki.length) satirlar.push(`🤔 Belli değil (${belki.length}): ` + belki.join(', '));
              if (yok.length) satirlar.push(`❌ Yok (${yok.length}): ` + yok.join(', '));
              const kayitli = Object.values((await dbAl('pisti_bildirim/kayitli')) || {}).map(k => k && k.ad).filter(Boolean);
              const cevapsiz = [...new Set(kayitli)].filter(a => !cevaplayan.has(a)).sort((a, b) => a.localeCompare(b, 'tr')).map(ad);
              if (cevapsiz.length) satirlar.push(`⏳ Cevap vermedi (${cevapsiz.length}): ` + cevapsiz.join(', '));
              baslik = '🃏 ' + (ne === 'Bugün' ? 'Bugünün' : ne + ' için') + ' durumu (' + gunAdi + ')';
              govde = satirlar.length ? satirlar.join('\n') : 'Henüz kimse cevap vermedi.';
            }
            const gorulen = new Set();
            const hedef = Object.entries(kayitlar || {}).filter(([, r]) => {
              const ab = r && r.abonelik;
              if (!ab || !ab.endpoint || !ab.keys || gorulen.has(ab.endpoint)) return false;
              gorulen.add(ab.endpoint);
              return is.herkese || !r.oyuncu || !cevaplayan.has(r.oyuncu);
            });

            console.log(`Anket: ${tarih} (${gunAdi}) · "${baslik}" · ${hedef.length} cihaz`);

            let basarili = 0;
            const silinecek = [];
            await Promise.all(hedef.map(async ([anahtar, r]) => {
              const veri = JSON.stringify({ data: { title: baslik, body: govde, gun: tarih, url: r.url || '', tag: is.tur === 'durum' ? 'pisti-durum-' + tarih : 'pisti-anket' } });
              try {
                await webpush.sendNotification(r.abonelik, veri, { TTL: 43200, urgency: 'high' });
                basarili++;
              } catch (e) {
                console.log('Gönderilemedi:', r.oyuncu || '?', e.statusCode || '', (e.body || e.message || '').toString().slice(0, 200));
                if (e.statusCode === 404 || e.statusCode === 410) silinecek.push(anahtar);
              }
            }));
            for (const k of silinecek) await dbSil('pisti_bildirim/tokens/' + k);

            await dbYaz('pisti_bildirim/sonGonderim', {
              t: Date.now(), kaynak: is.kaynak, baslik, govde, gun: tarih,
              hedef: hedef.length, basarili, kisiler: [...new Set(hedef.map(([, r]) => r.oyuncu || '?'))]
            });
            if (!(await dbAl('pisti_anket/' + tarih + '/acildi'))) await dbYaz('pisti_anket/' + tarih + '/acildi', Date.now());
            console.log(`Bitti: ${basarili}/${hedef.length} cihaza gitti, ${silinecek.length} geçersiz kayıt silindi.`);
          }

          // ── Anket cevabı bildirimleri ──
          // Uygulama her cevapta pisti_bildirim/cevapOlay/<isim> kaydı yazar (kişi başına son cevap).
          // Burada toplanıp bildirimi açık diğer herkese tek bildirim olarak gönderilir.
          const CEVAP_YAZI = { var: 'Varım ✅', belki: 'Belli değil 🤔', yok: 'Yokum ❌', kaldirdi: 'cevabını kaldırdı' };

          async function cevapBildir() {
            const saat = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Istanbul', hour: '2-digit', hourCycle: 'h23' }).format(new Date()));
            if (saat < 9) { console.log('Gece saatleri: cevap bildirimleri sabaha bekletiliyor.'); return; }
            const olaylar = await dbAl('pisti_bildirim/cevapOlay');
            if (!olaylar) return;
            const liste = Object.entries(olaylar).filter(([, o]) => o && o.ad && o.gun && o.cevap);
            // İşlenecek kayıtları sil (bu arada yenisi yazıldıysa ona dokunma)
            for (const [k, o] of Object.entries(olaylar)) {
              const simdi = await dbAl('pisti_bildirim/cevapOlay/' + k);
              if (simdi && simdi.t === (o && o.t)) await dbSil('pisti_bildirim/cevapOlay/' + k);
            }
            const taze = liste.filter(([, o]) => Date.now() - (o.t || 0) < 12 * 3600e3);
            if (!taze.length) return;

            const gunler = [...new Set(taze.map(([, o]) => o.gun))];
            const kayitlar = (await dbAl('pisti_bildirim/tokens')) || {};
            const gorulen = new Set();
            const cihazlar = Object.entries(kayitlar).filter(([, r]) => {
              const ab = r && r.abonelik;
              if (!ab || !ab.endpoint || !ab.keys || gorulen.has(ab.endpoint)) return false;
              gorulen.add(ab.endpoint);
              return true;
            });

            for (const gun of gunler) {
              const bu = taze.map(([, o]) => o).filter(o => o.gun === gun).sort((a, b) => a.t - b.t);
              const cevaplar = Object.values((await dbAl('pisti_anket/' + gun + '/cevaplar')) || {});
              const say = c => cevaplar.filter(x => x && x.cevap === c).length;
              const ozet = `Toplam: ${say('var')} var · ${say('belki')} belli değil · ${say('yok')} yok`;
              const bugun = istanbulTarih(0), yarin = istanbulTarih(1);
              const ne = gun === bugun ? 'Bugün' : gun === yarin ? 'Yarın' : GUNLER[haftaGunu(gun)];
              const baslik = '🃏 ' + ne + ' kim var?';
              let gonderilen = 0, basarili = 0;
              const silinecek = [];
              await Promise.all(cihazlar.map(async ([anahtar, r]) => {
                // Kişiye kendi cevabı bildirilmez
                const satirlar = bu.filter(o => o.ad !== r.oyuncu)
                  .map(o => o.ad.split(' ')[0] + ': ' + (CEVAP_YAZI[o.cevap] || o.cevap) + (o.cevap === 'var' && o.saat ? ' (' + o.saat + ')' : ''));
                if (!satirlar.length) return;
                gonderilen++;
                const govde = satirlar.join('\n') + '\n' + ozet;
                const veri = JSON.stringify({ data: { title: baslik, body: govde, gun, url: r.url || '', tag: 'pisti-cevap-' + gun } });
                try {
                  await webpush.sendNotification(r.abonelik, veri, { TTL: 21600, urgency: 'normal' });
                  basarili++;
                } catch (e) {
                  console.log('Gönderilemedi:', r.oyuncu || '?', e.statusCode || '');
                  if (e.statusCode === 404 || e.statusCode === 410) silinecek.push(anahtar);
                }
              }));
              for (const k of silinecek) await dbSil('pisti_bildirim/tokens/' + k);
              console.log(`Cevap bildirimi (${gun}): ${bu.length} cevap · ${basarili}/${gonderilen} cihaza gitti.`);
            }
          }

          async function main() {
            await anaIs();
            try { await cevapBildir(); } catch (e) { console.error('Cevap bildirimi hatası:', e); }
          }

          main().then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); });
          JS_SONU

      - name: Bildirimleri gönder
        if: steps.kontrol.outputs.is == 'var'
        working-directory: bildirim
        env:
          VAPID_GIZLI: ${{ secrets.VAPID_GIZLI }}
          OLAY: ${{ github.event_name }}
          ZAMAN: ${{ github.event.schedule }}
          SLOT: ${{ steps.kontrol.outputs.slot }}
          KONTROL: ${{ inputs.slot }}
          MESAJ: ${{ inputs.mesaj }}
          GUN: ${{ inputs.gun }}
          HERKESE: ${{ inputs.herkese }}
        run: node gonder.js
