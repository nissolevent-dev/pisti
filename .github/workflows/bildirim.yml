name: Bildirim gönder

# Bildirimi gönderen kod (gonder.js) bu dosyanın içinde, ayrıca dosya gerekmez.
# Saatler UTC'dir (İstanbul = UTC+3).
on:
  schedule:
    - cron: '0 17 * * 2'      # Salı 20:00       — Yarın kim var?
    - cron: '0 19 * * 2'      # Salı 22:00       — hatırlatma
    - cron: '0 13 * * 3'      # Çarşamba 16:00   — hatırlatma
    - cron: '0 17 * * 5'      # Cuma 20:00       — Yarın kim var?
    - cron: '0 19 * * 5'      # Cuma 22:00       — hatırlatma
    - cron: '0 8 * * 6'       # Cumartesi 11:00  — hatırlatma
    - cron: '*/5 6-21 * * *'  # 09:00–00:55 arası 5 dakikada bir: uygulamadan gelen gönderme isteği var mı?
  workflow_dispatch:
    inputs:
      mesaj:
        description: 'Mesaj (boş bırakırsan "Kim var?" gider)'
        required: false
        default: ''
      gun:
        description: 'Anket hangi gün için?'
        type: choice
        options: [otomatik, bugun, yarin]
        default: otomatik
      herkese:
        description: 'Cevap vermiş olanlara da gönder'
        type: boolean
        default: false
      slot:
        description: 'Boş bırak (cron-job.org otomatik çağrısı "kontrol" gönderir)'
        required: false
        default: ''

concurrency:
  group: bildirim
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yapılacak iş var mı?
        id: kontrol
        run: |
          DB="https://pisti-2f056-default-rtdb.europe-west1.firebasedatabase.app"
          # 5 dakikalık kontrol: GitHub'ın kendi zamanlaması ya da cron-job.org'dan gelen "kontrol" çağrısı
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/5 6-21 * * *" ]; } || [ "${{ inputs.slot }}" = "kontrol" ]; then
            # GitHub saat başı görevlerini bazen geciktiriyor ya da hiç çalıştırmıyor.
            # Bu yüzden 5 dakikalık kontrol, saati geçmiş ama gönderilmemiş bildirimi de yakalar (2 saat içinde).
            GUN=$(TZ=Europe/Istanbul date +%u); SA=$(TZ=Europe/Istanbul date +%H%M | sed 's/^0*//'); SA=${SA:-0}
            BUGUN=$(TZ=Europe/Istanbul date +%F); YARIN=$(TZ=Europe/Istanbul date -d tomorrow +%F)
            for S in "2 2000 sali20 $YARIN" "2 2200 sali22 $YARIN" "3 1600 carsamba16 $BUGUN" "5 2000 cuma20 $YARIN" "5 2200 cuma22 $YARIN" "6 1100 cumartesi11 $BUGUN"; do
              set -- $S
              if [ "$GUN" = "$1" ] && [ "$SA" -ge "$2" ] && [ "$SA" -lt $(( $2 + 200 )) ]; then
                F=$(curl -s --max-time 20 "$DB/pisti_bildirim/gonderilen/${4}_${3}.json")
                if [ "$F" = "null" ]; then
                  echo "Zamanı gelmiş bildirim: $3"
                  echo "slot=$3" >> "$GITHUB_OUTPUT"
                  echo "is=var" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            done
            V=$(curl -s --max-time 20 "$DB/pisti_bildirim/istek.json")
            if [ -z "$V" ] || [ "$V" = "null" ]; then
              echo "Bekleyen iş yok."
              echo "is=yok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "is=var" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.kontrol.outputs.is == 'var'
        with:
          node-version: 20

      - name: Kurulum
        if: steps.kontrol.outputs.is == 'var'
        run: |
          mkdir -p bildirim && cd bildirim
          npm init -y > /dev/null
          npm install --no-audit --no-fund --loglevel=error web-push@3
          cat > gonder.js <<'JS_SONU'
          // Pişti — "Kim var?" bildirimlerini gönderir (standart Web Push, Firebase Messaging kullanılmaz).
          // GitHub Actions'taki "Bildirim gönder" görevi çalıştırır.
          //
          // Üç şekilde çalışır:
          //   1) Zamanlanmış: salı/cuma 20:00, hatırlatmalar 22:00 ve ertesi gün (çarşamba 16:00, cumartesi 11:00)
          //   2) Elle: GitHub → Actions → "Bildirim gönder" → Run workflow
          //   3) Uygulamadan: uygulamadaki "📣 Bildirim gönder" isteği pisti_bildirim/istek'e yazılır,
          //      görev 5 dakikada bir bakar ve gönderir.
          //
          // Bildirim yalnızca o günün anketine henüz cevap vermemiş kişilere gider
          // ("Cevap vermiş olanlara da gönder" seçilmedikçe).

          const webpush = require('web-push');

          const DB_URL = 'https://pisti-2f056-default-rtdb.europe-west1.firebasedatabase.app';
          const VAPID_ACIK = 'BNIJ6_b47nZk0g2nboe8QYKGQq6s3r-yKZL3JcqBvxSg0kjN4_nsEN8pUgTsyDhVc3cbdieLFmE1uI_VXwO_BcY';
          const VAPID_KONU = 'https://nissolevent-dev.github.io/pisti/';

          // Cron ifadesi → bildirim türü. gunFark: anketin günü (0 = bugün, 1 = yarın)
          const SLOTLAR = {
            '0 17 * * 2': { ad: 'sali20', gunFark: 1, tur: 'ilk' },
            '0 19 * * 2': { ad: 'sali22', gunFark: 1, tur: 'hatirlatma' },
            '0 13 * * 3': { ad: 'carsamba16', gunFark: 0, tur: 'hatirlatma' },
            '0 17 * * 5': { ad: 'cuma20', gunFark: 1, tur: 'ilk' },
            '0 19 * * 5': { ad: 'cuma22', gunFark: 1, tur: 'hatirlatma' },
            '0 8 * * 6': { ad: 'cumartesi11', gunFark: 0, tur: 'hatirlatma' }
          };

          const GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

          // Firebase Realtime Database (REST)
          async function dbAl(yol) {
            const r = await fetch(`${DB_URL}/${yol}.json`);
            if (!r.ok) throw new Error(`Okunamadı: ${yol} (${r.status})`);
            return r.json();
          }
          async function dbYaz(yol, deger) {
            const r = await fetch(`${DB_URL}/${yol}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(deger) });
            if (!r.ok) throw new Error(`Yazılamadı: ${yol} (${r.status})`);
          }
          async function dbSil(yol) {
            const r = await fetch(`${DB_URL}/${yol}.json`, { method: 'DELETE' });
            if (!r.ok) throw new Error(`Silinemedi: ${yol} (${r.status})`);
          }

          // İstanbul saatine göre YYYY-MM-DD
          function istanbulTarih(fark) {
            const an = new Date(Date.now() + (fark || 0) * 864e5);
            return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(an);
          }
          function haftaGunu(tarih) { return new Date(tarih + 'T12:00:00Z').getUTCDay(); }
          // Salı ve cuma "yarın", diğer günler "bugün"
          function otomatikFark() { const g = haftaGunu(istanbulTarih(0)); return (g === 2 || g === 5) ? 1 : 0; }

          async function main() {
            const gizli = (process.env.VAPID_GIZLI || '').trim();
            if (!gizli) throw new Error('VAPID_GIZLI gizli bilgisi eksik.');
            webpush.setVapidDetails(VAPID_KONU, VAPID_ACIK, gizli);

            const olay = process.env.OLAY || '';
            const zaman = process.env.ZAMAN || '';
            let is;

            const slotAd = Object.values(SLOTLAR).find(x => x.ad === process.env.SLOT);
            if (olay === 'workflow_dispatch' && !slotAd && process.env.KONTROL !== 'kontrol') {
              is = { kaynak: 'github', mesaj: (process.env.MESAJ || '').trim(), gun: process.env.GUN || 'otomatik', herkese: process.env.HERKESE === 'true' };
            } else if (slotAd || SLOTLAR[zaman]) {
              const s = slotAd || SLOTLAR[zaman];
              is = { kaynak: 'zaman', slot: s.ad, fark: s.gunFark, tur: s.tur, herkese: false };
            } else {
              // Uygulamadan gelen istek
              const v = await dbAl('pisti_bildirim/istek');
              if (!v) { console.log('Bekleyen istek yok.'); return; }
              await dbSil('pisti_bildirim/istek');
              if (Date.now() - (v.t || 0) > 3 * 3600e3) { console.log('3 saatten eski istek atlandı.'); return; }
              is = { kaynak: 'uygulama', mesaj: String(v.mesaj || '').trim(), gun: v.gun || 'otomatik', herkese: !!v.herkese, kim: v.kim || '' };
            }

            const fark = is.fark != null ? is.fark : (is.gun === 'bugun' ? 0 : is.gun === 'yarin' ? 1 : otomatikFark());
            const tarih = istanbulTarih(fark);
            const gunAdi = GUNLER[haftaGunu(tarih)];
            const ne = fark === 1 ? 'Yarın' : 'Bugün';

            // Zamanlanmış bildirim aynı gün iki kez gitmesin (görevler sırayla çalışır)
            if (is.kaynak === 'zaman') {
              const k = 'pisti_bildirim/gonderilen/' + tarih + '_' + is.slot;
              if (await dbAl(k)) { console.log('Bu bildirim zaten gönderilmiş.'); return; }
              await dbYaz(k, Date.now());
            }

            let baslik, govde;
            if (is.mesaj) {
              baslik = 'Pişti 🃏';
              govde = is.mesaj;
            } else if (is.tur === 'hatirlatma') {
              baslik = 'Hatırlatma: ' + ne + ' kim var? 🃏';
              govde = gunAdi + ' için henüz cevap vermedin. Dokun, Varım / Yokum de.';
            } else {
              baslik = ne + ' kim var? 🃏';
              govde = gunAdi + ' için cevabını ver: Varım / Belli değil / Yokum';
            }

            const [kayitlar, cevaplar] = await Promise.all([
              dbAl('pisti_bildirim/tokens'),
              dbAl('pisti_anket/' + tarih + '/cevaplar')
            ]);
            const cevaplayan = new Set(Object.values(cevaplar || {}).map(c => c && c.ad).filter(Boolean));
            const gorulen = new Set();
            const hedef = Object.entries(kayitlar || {}).filter(([, r]) => {
              const ab = r && r.abonelik;
              if (!ab || !ab.endpoint || !ab.keys || gorulen.has(ab.endpoint)) return false;
              gorulen.add(ab.endpoint);
              return is.herkese || !r.oyuncu || !cevaplayan.has(r.oyuncu);
            });

            console.log(`Anket: ${tarih} (${gunAdi}) · "${baslik}" · ${hedef.length} cihaz`);

            let basarili = 0;
            const silinecek = [];
            await Promise.all(hedef.map(async ([anahtar, r]) => {
              const veri = JSON.stringify({ data: { title: baslik, body: govde, gun: tarih, url: r.url || '' } });
              try {
                await webpush.sendNotification(r.abonelik, veri, { TTL: 43200, urgency: 'high' });
                basarili++;
              } catch (e) {
                console.log('Gönderilemedi:', r.oyuncu || '?', e.statusCode || '', (e.body || e.message || '').toString().slice(0, 200));
                if (e.statusCode === 404 || e.statusCode === 410) silinecek.push(anahtar);
              }
            }));
            for (const k of silinecek) await dbSil('pisti_bildirim/tokens/' + k);

            await dbYaz('pisti_bildirim/sonGonderim', {
              t: Date.now(), kaynak: is.kaynak, baslik, govde, gun: tarih,
              hedef: hedef.length, basarili, kisiler: [...new Set(hedef.map(([, r]) => r.oyuncu || '?'))]
            });
            if (!(await dbAl('pisti_anket/' + tarih + '/acildi'))) await dbYaz('pisti_anket/' + tarih + '/acildi', Date.now());
            console.log(`Bitti: ${basarili}/${hedef.length} cihaza gitti, ${silinecek.length} geçersiz kayıt silindi.`);
          }

          main().then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); });
          JS_SONU

      - name: Bildirimleri gönder
        if: steps.kontrol.outputs.is == 'var'
        working-directory: bildirim
        env:
          VAPID_GIZLI: ${{ secrets.VAPID_GIZLI }}
          OLAY: ${{ github.event_name }}
          ZAMAN: ${{ github.event.schedule }}
          SLOT: ${{ steps.kontrol.outputs.slot }}
          KONTROL: ${{ inputs.slot }}
          MESAJ: ${{ inputs.mesaj }}
          GUN: ${{ inputs.gun }}
          HERKESE: ${{ inputs.herkese }}
        run: node gonder.js
